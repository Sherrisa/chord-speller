<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chord Speller App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Chord Speller App</h1>
      </header>
      <main>
        <div class="app">
          <select id="root">
            <option selected>Root</option>
            <option value="csharp">C#</option>
            <option value="fsharp">F#</option>
            <option value="b">B</option>
            <option value="e">E</option>
            <option value="a">A</option>
            <option value="d">D</option>
            <option value="g">G</option>
            <option value="c">C</option>
            <option value="f">F</option>
            <option value="bb">Bb</option>
            <option value="eb">Eb</option>
            <option value="ab">Ab</option>
            <option value="db">Db</option>
            <option value="gb">Gb</option>
          </select>
          <select id="quality">
            <option selected>Quality</option>
            <option value="major">major</option>
            <option value="m">minor</option>
            <option value="dim">dim</option>
            <option value="aug">aug</option>
            <option value="maj7">maj7</option>
            <option value="7">7</option>
            <option value="m7">m7</option>
            <option value="m7b5">m7b5</option>
            <option value="dim7">dim7</option>
            <option value="maj9">maj9</option>
            <option value="9">9</option>
            <option value="7b9">7b9</option>
            <option value="7sharp5sharp9">7#5#9</option>
            <option value="11">11</option>
            <option value="13">13</option>
            <option value="maj11">maj11</option>
            <option value="maj13">maj13</option>
          </select>
          <button type="button" id="showNotesBtn">Show Notes</button>
        </div>
        <div id="showNotes"></div>
      </main>
      <script src="scripts.js"></script>
    </div>
  </body>
</html>
